[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  NEXT_PUBLIC_API_URL = "https://cnpi-hybrid-rag-1.onrender.com"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Redirect .netlify.app domain → custom domain (301 Permanent)
# Must come FIRST so it takes priority over all other rules
[[redirects]]
  from = "https://cnpichat.netlify.app/*"
  to = "https://cnpichat.diplomabazar.com/:splat"
  status = 301
  force = true

# /admin-panel → backend admin panel login (production)
# This Netlify-level redirect runs BEFORE Next.js,
# so it works even if Next.js redirects can't reach external URLs.
[[redirects]]
  from = "/admin-panel"
  to = "https://cnpi-hybrid-rag-1.onrender.com/admin-panel/login/"
  status = 307
  force = true

[[redirects]]
  from = "/admin-panel/"
  to = "https://cnpi-hybrid-rag-1.onrender.com/admin-panel/login/"
  status = 307
  force = true

# Catch-all for Next.js routing (must be LAST)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
